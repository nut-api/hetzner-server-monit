apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - deploy/k8s.yaml
# Code ships as a ConfigMap; the hash suffix rolls the pod whenever a file changes.
configMapGenerator:
  - name: monit-app
    files:
      - app/main.py
      - app/hetzner.py
      - app/store.py
      - app/requirements.txt
