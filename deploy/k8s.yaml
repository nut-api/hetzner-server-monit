apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monit-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hetzner-server-monit
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume + one bot connection
  selector:
    matchLabels:
      app: hetzner-server-monit
  template:
    metadata:
      labels:
        app: hetzner-server-monit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: deps
          image: python:3.13-slim
          command: [pip, install, --no-cache-dir, --disable-pip-version-check, --target, /deps, -r, /app/requirements.txt]
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: deps, mountPath: /deps }
      containers:
        - name: monit
          image: python:3.13-slim
          command: [python, /app/main.py]
          env:
            - { name: PYTHONPATH, value: /deps }
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: STATE_PATH, value: /data/state.json }
            - { name: POLL_SECONDS, value: "30" }
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: monit-discord
                  key: DISCORD_TOKEN
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: deps, mountPath: /deps, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: app
          configMap:
            name: monit-app
        - name: deps
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: monit-state
